  <script>
    const colores = ["red", "cyan", "deeppink", "mediumspringgreen", "yellow"];

    let i = 0;

    setInterval(() => {
      document.body.style.backgroundColor = colores[i];
      i = (i + 1) % colores.length;
    }, 300);

    const marquee = document.querySelector(".marquee-contenido");

    let x = -window.innerWidth;
    let tiempo = 1;

    function animar() {
      x += 2;

      // Amplitud de la onda
      const amplitud = 2;

      // Frecuencia de la onda
      const frecuencia = 0.1;

      const y = Math.sin(tiempo * frecuencia) * amplitud;

      marquee.style.transform = `translate(${x}px, ${y}px)`;

      tiempo++;

      if (x > window.innerWidth) {
        x = -marquee.offsetWidth;
      }

      requestAnimationFrame(animar);
    }

    animar();
  </script>
